root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./main.go"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor"]
  include_ext = ["go"]
  kill_delay = "0s"
  log = "build-errors.log"
  stop_on_error = false

[log]
  time = false

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
  main = "magenta"

[misc]
  clean_on_exit = false
